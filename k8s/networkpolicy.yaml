apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gnw-app-netpol
  namespace: gnw
spec:
  podSelector:
    matchLabels:
      app: gnw-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gnw
      ports:
        - protocol: TCP
          port: 5432  # postgres
    - ports:
        - protocol: TCP
          port: 443   # outbound HTTPS only
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
