services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-gnw_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: gnw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_ADMIN_USER:-gnw_admin} -d gnw"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL}
      GNW_POSTGRES_SSL_REQUIRED: "true"
      GNW_APP_DB_USER: ${GNW_APP_DB_USER:-gnw_app}
      GNW_APP_DB_PASSWORD: ${GNW_APP_DB_PASSWORD:?set GNW_APP_DB_PASSWORD}
    command: ["sh","-c","node scripts/provision-db-role.mjs && node scripts/migrate.mjs"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  app-a:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: &app-env
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      GNW_POSTGRES_SSL_REQUIRED: "true"
      EXECUTOR_URL: ${EXECUTOR_URL:?set EXECUTOR_URL}
      EXECUTOR_SECRET: ${EXECUTOR_SECRET:?set EXECUTOR_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VIDEO_PROVIDER_URL: ${VIDEO_PROVIDER_URL:-}
      VIDEO_PROVIDER_API_KEY: ${VIDEO_PROVIDER_API_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      ARTIFACT_DIR: /data/artifacts
      GNW_GRANT_ISSUER: ${GNW_GRANT_ISSUER:?set GNW_GRANT_ISSUER}
      GNW_GRANT_PRIVATE_KEY_PEM: ${GNW_GRANT_PRIVATE_KEY_PEM:?set GNW_GRANT_PRIVATE_KEY_PEM}
      GNW_GRANT_PUBLIC_KEY_PEM: ${GNW_GRANT_PUBLIC_KEY_PEM:?set GNW_GRANT_PUBLIC_KEY_PEM}
      GNW_LEASE_PRIVATE_KEY_PEM: ${GNW_LEASE_PRIVATE_KEY_PEM:?set GNW_LEASE_PRIVATE_KEY_PEM}
      GNW_REQUIRE_SIGNED_GRANTS: "true"
      GNW_EGRESS_ALLOW_LIST: ${GNW_EGRESS_ALLOW_LIST:?set GNW_EGRESS_ALLOW_LIST}
    volumes:
      - app-a-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /var/tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    restart: unless-stopped

  app-b:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *app-env
    volumes:
      - app-b-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /var/tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    restart: unless-stopped

volumes:
  db-data:
  app-a-data:
  app-b-data:
