services:
  db:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: gnw
      GNW_APP_DB_USER: ${GNW_APP_DB_USER:?set GNW_APP_DB_USER}
      GNW_APP_DB_PASSWORD: ${GNW_APP_DB_PASSWORD:?set GNW_APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d gnw"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data
      - ${POSTGRES_TLS_DIR:?set POSTGRES_TLS_DIR}:/tls:ro
      - ./deploy/postgres/10-create-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    command: >-
      postgres
      -c ssl=on
      -c ssl_cert_file=/tls/server.crt
      -c ssl_key_file=/tls/server.key
      -c ssl_ca_file=/tls/ca.crt

  app-a:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment: &app-env
      NODE_ENV: production
      PORT: 3000
      GNW_RELEASE_COMMIT_SHA: ${GNW_RELEASE_COMMIT_SHA:?set GNW_RELEASE_COMMIT_SHA}
      DATABASE_URL: postgresql://${GNW_APP_DB_USER:?set GNW_APP_DB_USER}:${GNW_APP_DB_PASSWORD:?set GNW_APP_DB_PASSWORD}@db:5432/gnw?sslmode=verify-full
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      GNW_POSTGRES_SSL_REQUIRED: "true"
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
      EXECUTOR_URL: ${EXECUTOR_URL:?set EXECUTOR_URL}
      EXECUTOR_SECRET: ${EXECUTOR_SECRET:?set EXECUTOR_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VIDEO_PROVIDER_URL: ${VIDEO_PROVIDER_URL:-}
      VIDEO_PROVIDER_API_KEY: ${VIDEO_PROVIDER_API_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      ARTIFACT_DIR: /data/artifacts
      GNW_SHARED_STORAGE_CONFIRMED: ${GNW_SHARED_STORAGE_CONFIRMED:-false}
      GNW_GRANT_ISSUER: ${GNW_GRANT_ISSUER:?set GNW_GRANT_ISSUER}
      GNW_GRANT_PRIVATE_KEY_PEM: ${GNW_GRANT_PRIVATE_KEY_PEM:?set GNW_GRANT_PRIVATE_KEY_PEM}
      GNW_GRANT_PUBLIC_KEY_PEM: ${GNW_GRANT_PUBLIC_KEY_PEM:?set GNW_GRANT_PUBLIC_KEY_PEM}
      GNW_REQUIRE_SIGNED_GRANTS: "true"
      GNW_LEASE_PRIVATE_KEY_PEM: ${GNW_LEASE_PRIVATE_KEY_PEM:?set GNW_LEASE_PRIVATE_KEY_PEM}
      GNW_LEASE_PUBLIC_KEY_PEM: ${GNW_LEASE_PUBLIC_KEY_PEM:?set GNW_LEASE_PUBLIC_KEY_PEM}
      GNW_REQUIRE_TEE_ATTESTATION: "true"
      GNW_TEE_ATTESTATION_ISSUER: ${GNW_TEE_ATTESTATION_ISSUER:?set GNW_TEE_ATTESTATION_ISSUER}
      GNW_TEE_ATTESTATION_PUBLIC_KEY_PEM: ${GNW_TEE_ATTESTATION_PUBLIC_KEY_PEM:?set GNW_TEE_ATTESTATION_PUBLIC_KEY_PEM}
      GNW_TEE_ATTESTATION_MEASUREMENT: ${GNW_TEE_ATTESTATION_MEASUREMENT:?set GNW_TEE_ATTESTATION_MEASUREMENT}
      GNW_TEE_ATTESTATION_MAX_AGE_MS: ${GNW_TEE_ATTESTATION_MAX_AGE_MS:?set GNW_TEE_ATTESTATION_MAX_AGE_MS}
      GNW_TEE_ATTESTATION_EVIDENCE_JSON: ${GNW_TEE_ATTESTATION_EVIDENCE_JSON:?set GNW_TEE_ATTESTATION_EVIDENCE_JSON}
      GNW_REQUIRE_MPC_TRUST_ANCHOR: "true"
      GNW_MPC_TRUST_ANCHOR_JSON: ${GNW_MPC_TRUST_ANCHOR_JSON:?set GNW_MPC_TRUST_ANCHOR_JSON}
      GNW_MPC_TRUST_ANCHOR_EVIDENCE_JSON: ${GNW_MPC_TRUST_ANCHOR_EVIDENCE_JSON:?set GNW_MPC_TRUST_ANCHOR_EVIDENCE_JSON}
      GNW_EGRESS_ALLOW_LIST: ${GNW_EGRESS_ALLOW_LIST:?set GNW_EGRESS_ALLOW_LIST}
    command: ["sh","-ec","node scripts/preflight-production.mjs && exec node dist/server/app.js"]
    volumes:
      - app-a-data:/data
      - ${POSTGRES_TLS_DIR:?set POSTGRES_TLS_DIR}:/tls:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /var/tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g

  app-b:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    command: ["sh","-ec","node scripts/preflight-production.mjs && exec node dist/server/app.js"]
    volumes:
      - app-b-data:/data
      - ${POSTGRES_TLS_DIR:?set POSTGRES_TLS_DIR}:/tls:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /var/tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g

volumes:
  db-data:
  app-a-data:
  app-b-data:
