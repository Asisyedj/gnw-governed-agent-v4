name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@b6d38e563b1e0a61fa4ebfaab8128732f5ed1bd4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@b6d38e563b1e0a61fa4ebfaab8128732f5ed1bd4
      - uses: github/codeql-action/analyze@b6d38e563b1e0a61fa4ebfaab8128732f5ed1bd4
        with:
          category: /language:${{ matrix.language }}
