name: red-team-regression

on:
  schedule:
    - cron: "41 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-regression:
    name: Governed-Agent Red Team Simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with: { node-version: "22.x", cache: npm }
      - run: npm ci
      - name: Authorization and tenant-isolation abuse cases
        run: npm test -- --run src/tests/unit/production-controls.test.ts
      - name: Runtime attestation tamper cases
        run: npm test -- --run src/tests/unit/attestation.test.ts
      - name: Production closure safety assertions
        run: npm run verify:production
      - name: Dependency and secret hygiene
        run: npm audit --audit-level=high
      - name: Red-team evidence manifest
        run: |
          mkdir -p red-team-evidence
          git rev-parse HEAD > red-team-evidence/commit-sha.txt
          printf "scope=authorization,tenant-isolation,replay,approval,egress,attestation,execution-order\n" > red-team-evidence/scope.txt
          printf "completed=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> red-team-evidence/scope.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: red-team-regression-${{ github.sha }}
          path: red-team-evidence/
          retention-days: 180
