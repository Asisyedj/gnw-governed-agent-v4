name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with: { node-version: "22.x", cache: npm }
      - name: Verify clean checkout
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          git diff --check
          test "$(git describe --exact-match --tags HEAD 2>/dev/null || true)" = "$GITHUB_REF_NAME"
      - name: Install from committed lockfile
        run: npm ci
      - name: Verify production closure
        run: npm run verify:production
      - name: Verify database RLS
        run: npm run verify:rls
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Generate SBOM
        run: |
          npm exec --yes --package=@cyclonedx/cyclonedx-npm -- cyclonedx-npm --output-format json --output-file sbom.json
      - name: Create SHA256 manifest
        run: |
          test -d dist
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS.txt
      - name: Verify release artifacts
        run: |
          test -s sbom.json
          test -s dist/SHA256SUMS.txt
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             --verify-tag             --generate-notes             sbom.json             dist/SHA256SUMS.txt
