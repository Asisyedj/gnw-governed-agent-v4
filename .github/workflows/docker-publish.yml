name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-push:
    name: Build & Push Container
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image:  ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          provenance: true
          sbom: true

      - name: Production container smoke test
        env:
          IMAGE_TAG: ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}
        run: |
          set -eu
          COOKIE_SECRET="$(printf "x%.0s" $(seq 1 64))"
          docker pull "$IMAGE_TAG"
          docker run -d --rm --name gnw-production-smoke \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://127.0.0.1:5432/gnw \
            -e COOKIE_SECRET="$COOKIE_SECRET" \
            -p 18080:3000 \
            "$IMAGE_TAG"
          cleanup() {
            docker logs gnw-production-smoke || true
            docker stop gnw-production-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health >/tmp/gnw-health.json; then
              grep -q '"ok":true' /tmp/gnw-health.json
              exit 0
            fi
            sleep 2
          done
          echo "production container health check did not become ready"
          exit 1
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name:   ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
