name: GNW Release Certification Evidence
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA to evaluate
        required: true
        type: string
jobs:
  candidate-evidence:
    name: Collect candidate evidence (not a production certificate)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: gnw-candidate-evidence
    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: gnw_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gnw_admin_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gnw_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gnw_app:gnw_app_pw@localhost:5432/gnw_test
      COOKIE_SECRET: ci-test-cookie-secret-minimum-32-chars-ok
      LOG_LEVEL: silent
      GNW_POSTGRES_SSL_REQUIRED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with:
          node-version: '22.x'
          cache: npm
      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          git diff --check
      - name: Verify direct mission runner is blocked in production
        shell: bash
        run: |
          set -euo pipefail
          if NODE_ENV=production node scripts/run-governed-agent-mission.mjs >/tmp/gnw-mission-runner.log 2>&1; then
            echo "Direct mission runner unexpectedly executed in production mode" >&2
            exit 1
          fi
          grep -q "disabled in production" /tmp/gnw-mission-runner.log
      - name: Clean dependency install
        run: npm ci
      - name: Provision disposable PostgreSQL roles
        env:
          PGPASSWORD: gnw_admin_pw
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "CREATE ROLE gnw_app LOGIN PASSWORD 'gnw_app_pw' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "CREATE ROLE gnw_migrator LOGIN PASSWORD 'gnw_migrator_pw' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "CREATE ROLE gnw_audit_verifier NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT gnw_audit_verifier TO gnw_migrator;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO gnw_audit_verifier;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT CONNECT, TEMPORARY ON DATABASE gnw_test TO gnw_app, gnw_migrator;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO gnw_app;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO gnw_migrator;"
      - name: Run migrations with dedicated migrator role
        env:
          DATABASE_URL: postgresql://gnw_migrator:gnw_migrator_pw@localhost:5432/gnw_test
        run: npm run db:migrate
      - name: Grant runtime database privileges
        env:
          PGPASSWORD: gnw_admin_pw
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gnw_app;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO gnw_app;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "REVOKE UPDATE, DELETE ON audit_log, nonces, interlocks FROM gnw_app;"
          PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGDATABASE=gnw_test sh deploy/postgres/20-finalize-audit-verifier.sh
      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint
      - name: Cryptographic, compliance, and release metadata checks
        run: |
          npm run verify:production
          npm run verify:crypto
          npm run verify:compliance
          npm run verify:git-release-metadata
      - name: Existing automated tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:gnw_admin_pw@localhost:5432/gnw_test
        run: npm test
      - name: RLS policy suite
        env:
          NODE_ENV: test
          GNW_RLS_EVIDENCE_PATH: certification-evidence/rls-policy-suite-results.json
        run: npm run test:rls:policy-suite
      - name: Governed mock harness tests
        run: npm run test:harness
      - name: Coverage and production build
        env:
          TEST_DATABASE_URL: postgresql://postgres:gnw_admin_pw@localhost:5432/gnw_test
        run: |
          npm run test:coverage
          npm run build
      - name: Authenticated kill-switch operational drill
        env:
          TEST_DATABASE_URL: postgresql://postgres:gnw_admin_pw@localhost:5432/gnw_test
        run: npx vitest run --config vitest.operational.config.ts --reporter=verbose
      - name: Verify global audit-chain integrity and runtime append-only grants
        env:
          DATABASE_URL: postgresql://postgres:gnw_admin_pw@localhost:5432/gnw_test
          GNW_AUDIT_VERIFY_USE_ROLE: "false"
        run: node scripts/verify-audit-chain.mjs --limit 100000
      - name: Collect candidate hashes and limitations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certification-evidence
          git rev-parse HEAD > certification-evidence/candidate-commit-sha.txt
          sha256sum package-lock.json > certification-evidence/package-lock.sha256
          if [ -d dist ]; then find dist -type f -print0 | sort -z | xargs -0 sha256sum > certification-evidence/dist.sha256; fi
          printf '%s\n' 'CANDIDATE_EVIDENCE_ONLY_NOT_A_PRODUCTION_CERTIFICATE' > certification-evidence/decision.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gnw-candidate-evidence-${{ inputs.candidate_sha }}
          path: certification-evidence/
          if-no-files-found: warn
          retention-days: 90
