name: continuous-security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-assurance:
    name: Continuous Security Assurance
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: gnw_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gnw_admin_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gnw_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gnw_app:gnw_app_pw@localhost:5432/gnw_test
      COOKIE_SECRET: ci-test-cookie-secret-minimum-32-chars-ok
      SESSION_SECRET: ci-test-session-secret-minimum-32-chars-ok
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with: { node-version: "22.x", cache: npm }
      - name: Install dependencies from committed lockfile
        run: npm ci
      - name: Verify direct mission runner is blocked in production
        run: node scripts/check-mission-runner-production-guard.mjs
      - name: Database roles and migrations
        env:
          PGPASSWORD: gnw_admin_pw
        run: |
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "CREATE ROLE gnw_app LOGIN PASSWORD 'gnw_app_pw' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "CREATE ROLE gnw_migrator LOGIN PASSWORD 'gnw_migrator_pw' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "CREATE ROLE gnw_audit_verifier NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT gnw_audit_verifier TO gnw_migrator;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT CONNECT, TEMPORARY ON DATABASE gnw_test TO gnw_app, gnw_migrator;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO gnw_app;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO gnw_migrator;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO gnw_audit_verifier;"
        
      - name: Migrate
        env:
          DATABASE_URL: postgresql://gnw_migrator:gnw_migrator_pw@localhost:5432/gnw_test
        run: npm run db:migrate
      - name: Runtime privileges
        env:
          PGPASSWORD: gnw_admin_pw
        run: |
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gnw_app;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO gnw_app;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "REVOKE UPDATE, DELETE ON audit_log, nonces, interlocks FROM gnw_app;"
          PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGDATABASE=gnw_test sh deploy/postgres/20-finalize-audit-verifier.sh
      - name: Verify global audit-chain integrity and runtime append-only grants
        env:
          DATABASE_URL: postgresql://postgres:gnw_admin_pw@localhost:5432/gnw_test
          GNW_AUDIT_VERIFY_USE_ROLE: "false"
        run: node scripts/verify-audit-chain.mjs --limit 100000
      - name: Continuous production closure gate
        run: npm run verify:production
      - name: Cryptographic closure gate
        run: npm run verify:crypto
      - name: RLS regression gate
        run: npm run verify:rls
      - name: Adversarial governance regression suite
        run: npm test -- --run src/tests/unit/production-controls.test.ts src/tests/unit/attestation.test.ts
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Record security evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-evidence
          git rev-parse HEAD > security-evidence/commit-sha.txt
          set +e
          npm audit --json > security-evidence/npm-audit.json
          audit_exit=$?
          set -e
          printf '%s\n' "$audit_exit" > security-evidence/npm-audit-exit-code.txt
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("security-evidence/npm-audit.json", "utf8"));
            const v = data.metadata && data.metadata.vulnerabilities;
            if (!v) throw new Error("npm audit JSON is missing vulnerability summary");
            if ((v.high || 0) > 0 || (v.critical || 0) > 0) {
              console.error("security evidence contains HIGH/CRITICAL vulnerabilities", v);
              process.exit(1);
            }
            console.log("npm audit evidence recorded; HIGH/CRITICAL counts are zero", {
              low: v.low || 0, moderate: v.moderate || 0, high: v.high || 0, critical: v.critical || 0,
              auditCommandExitCode: Number(fs.readFileSync("security-evidence/npm-audit-exit-code.txt", "utf8"))
            });
          '
          cp docs/RUNTIME_EXECUTION_POLICY.md security-evidence/runtime-policy.md
          printf "GNW-REP-1.0\n" > security-evidence/policy-version.txt
          printf "continuous-security=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> security-evidence/policy-version.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: continuous-security-${{ github.sha }}
          path: security-evidence/
          retention-days: 90

