name: ci
on:
  push:
    branches: [main, develop, gnw/production-closure-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: gnw_test, POSTGRES_USER: gnw, POSTGRES_PASSWORD: gnw_test_pw}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gnw -d gnw_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gnw:gnw_test_pw@localhost:5432/gnw_test
      GNW_POSTGRES_SSL_REQUIRED: "false"
      COOKIE_SECRET: ci-test-cookie-secret-minimum-32-chars-ok
      SESSION_SECRET: ci-test-session-secret-minimum-32-chars-ok
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Bootstrap lockfile for verification
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          test -s package-lock.json
      - name: Emit lockfile evidence
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data=base64.b64encode(Path("package-lock.json").read_bytes()).decode()
          for i in range(0,len(data),3500):
              print(f"GNW_LOCK_CHUNK {i//3500} {data[i:i+3500]}")
          PY
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run migrations
        run: npm run db:migrate
      - name: Unit tests
        run: npm run test
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Build server
        run: npm run build:server
      - name: Build client
        run: npm run build:client
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: {fail-on-severity: high}
  evidence:
    name: Build Evidence
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Collect evidence
        run: |
          mkdir -p evidence
          node --version > evidence/node-version.txt
          npm --version > evidence/npm-version.txt
          npm audit --json > evidence/npm-audit.json
          sha256sum package-lock.json > evidence/package-lock.sha256
          jq -n --arg sha "${{ github.sha }}" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg lock "$(sha256sum package-lock.json | cut -d' ' -f1)" '{schema:"GNW.BuildEvidence.v2",sha:$sha,ts:$ts,packageLockSha256:$lock}' > evidence/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 90