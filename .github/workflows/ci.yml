name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: gnw_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gnw_admin_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gnw_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gnw_app:gnw_app_pw@localhost:5432/gnw_test
      COOKIE_SECRET: ci-test-cookie-secret-minimum-32-chars-ok
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with: { node-version: "22.x", cache: npm }
      - name: Verify clean checkout
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          test -n "$(git rev-parse HEAD)"
          git diff --check
      - name: Verify npm cache integrity
        run: npm cache verify
      - name: Clean install from committed lockfile
        run: npm ci
      - name: Provision dedicated database roles
        env:
          PGPASSWORD: gnw_admin_pw
        run: |
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE gnw_app LOGIN PASSWORD 'gnw_app_pw' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE gnw_migrator LOGIN PASSWORD 'gnw_migrator_pw' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 \
            -c "GRANT CONNECT, TEMPORARY ON DATABASE gnw_test TO gnw_app, gnw_migrator;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 \
            -c "GRANT USAGE ON SCHEMA public TO gnw_app;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO gnw_migrator;"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run migrations with dedicated migrator role
        env:
          DATABASE_URL: postgresql://gnw_migrator:gnw_migrator_pw@localhost:5432/gnw_test
        run: npm run db:migrate
      - name: Grant runtime database privileges
        env:
          PGPASSWORD: gnw_admin_pw
        run: |
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gnw_app;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO gnw_app;"
          psql -h 127.0.0.1 -U postgres -d gnw_test -v ON_ERROR_STOP=1 -c "REVOKE UPDATE, DELETE ON audit_log, nonces, interlocks FROM gnw_app;"
      - name: Verify production closure static gate
        run: npm run verify:production
      - name: Database RLS verification
        run: npm run verify:rls
      - name: Unit and integration tests
        run: npm run test
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Production container build
        run: docker build --pull -t gnw-production-smoke:${GITHUB_SHA} .
      - name: Production container runtime smoke test
        shell: bash
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://gnw_app:gnw_app_pw@127.0.0.1:5432/gnw_test
          COOKIE_SECRET: ci-smoke-cookie-secret-012345678901234567890123456789
          SESSION_SECRET: ci-smoke-session-secret-012345678901234567890123456789
          EXECUTOR_URL: https://127.0.0.1:8788
          EXECUTOR_SECRET: ci-smoke-executor-secret-012345678901234567890123456789
          GNW_REQUIRE_SIGNED_GRANTS: "true"
          GNW_GRANT_ISSUER: ci-smoke
          GNW_GRANT_PRIVATE_KEY_PEM: ci-smoke-private-key
          GNW_GRANT_PUBLIC_KEY_PEM: ci-smoke-public-key
          GNW_LEASE_PRIVATE_KEY_PEM: ci-smoke-lease-private-key
          GNW_EGRESS_ALLOW_LIST: api.openai.com
          LLM_BASE_URL: https://api.openai.com/v1
          LLM_API_KEY: ci-smoke-api-key
          STORAGE_DRIVER: local
          GNW_SHARED_STORAGE_CONFIRMED: "true"
          GNW_POSTGRES_SSL_REQUIRED: "false"
          TRUST_PROXY: "false"
          PORT: "3000"
          LOG_LEVEL: silent
        run: |
          set -euo pipefail
          docker rm -f gnw-production-smoke >/dev/null 2>&1 || true
          docker run -d --network host --name gnw-production-smoke             -e NODE_ENV             -e DATABASE_URL             -e COOKIE_SECRET             -e SESSION_SECRET             -e EXECUTOR_URL             -e EXECUTOR_SECRET             -e GNW_REQUIRE_SIGNED_GRANTS             -e GNW_GRANT_ISSUER             -e GNW_GRANT_PRIVATE_KEY_PEM             -e GNW_GRANT_PUBLIC_KEY_PEM             -e GNW_LEASE_PRIVATE_KEY_PEM             -e GNW_EGRESS_ALLOW_LIST             -e LLM_BASE_URL             -e LLM_API_KEY             -e STORAGE_DRIVER             -e GNW_SHARED_STORAGE_CONFIRMED             -e GNW_POSTGRES_SSL_REQUIRED             -e TRUST_PROXY             -e PORT             -e LOG_LEVEL             gnw-production-smoke:${GITHUB_SHA}
          trap 'docker logs gnw-production-smoke || true; docker rm -f gnw-production-smoke >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/gnw-health.json &&                curl -fsS http://127.0.0.1:3000/api/ready >/tmp/gnw-ready.json; then
              grep -q '"ok":true' /tmp/gnw-health.json
              grep -q '"ok":true' /tmp/gnw-ready.json
              exit 0
            fi
            sleep 2
          done
          echo "production container failed health/readiness smoke test"
          exit 1
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: ignore
          retention-days: 30

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@59e3b04e820c4cad30462696ac497853a5f7679c
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with: { fail-on-severity: high }

  evidence:
    name: Build Evidence
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with:
          node-version: "22.x"
          cache: npm
      - name: Install from committed lockfile
        run: npm ci
      - name: Collect evidence
        run: |
          mkdir -p evidence
          node --version > evidence/node-version.txt
          npm --version > evidence/npm-version.txt
          git rev-parse HEAD > evidence/commit-sha.txt
          git diff --check > evidence/diff-check.txt
          npm audit --json > evidence/npm-audit.json
          jq -n             --arg candidate "gnw-production-closure-v2"             --arg sha "$(git rev-parse HEAD)"             --arg ref "$GITHUB_REF"             --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg node "$(node --version)"             --arg npm "$(npm --version)"             '{schema:"GNW.BuildEvidence.v3",candidate:$candidate,sha:$sha,ref:$ref,ts:$ts,node:$node,npm:$npm}' > evidence/build.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 90
