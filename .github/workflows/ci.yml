name: ci

on:
  push:
    branches: [main, develop, "gnw/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gnw_test
          POSTGRES_USER: gnw
          POSTGRES_PASSWORD: gnw_test_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gnw -d gnw_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gnw:gnw_test_pw@localhost:5432/gnw_test
      COOKIE_SECRET: ci-test-cookie-secret-minimum-32-chars-ok
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Verify npm cache integrity
        run: npm cache verify
      - name: Ensure lockfile
        run: npm install --package-lock-only
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run migrations
        run: npm run db:migrate
      - name: Verify production closure static gate
        run: npm run verify:production
      - name: Unit tests
        run: npm run test
      - name: Reset test database for independent coverage run
        run: |
          PGPASSWORD=gnw_test_pw psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; DROP SCHEMA IF EXISTS drizzle CASCADE;"
          npm run db:migrate
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Build server
        run: npm run build:server
      - name: Build client
        run: npm run build:client
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Persist lockfile
        if: ${{ success() && github.event_name == 'pull_request' }}
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add reproducible npm lockfile"
            git push
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }

  evidence:
    name: Build Evidence
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - name: Collect evidence
        run: |
          mkdir -p evidence
          node --version > evidence/node-version.txt
          npm --version > evidence/npm-version.txt
          npm audit --json > evidence/npm-audit.json
          jq -n \
            --arg candidate "gnw-production-closure-v3" \
            --arg sha "$(git rev-parse HEAD)" \
            --arg ref "$GITHUB_REF" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg node "$(node --version)" \
            --arg npm "$(npm --version)" \
            '{schema:"GNW.BuildEvidence.v2",candidate:$candidate,sha:$sha,ref:$ref,ts:$ts,node:$node,npm:$npm}' > evidence/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 90
