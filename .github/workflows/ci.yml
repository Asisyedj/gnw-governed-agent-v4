name: ci

on:
  push:
    branches: [main, develop, "gnw/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gnw_test
          POSTGRES_USER: gnw_admin
          POSTGRES_PASSWORD: gnw_admin_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gnw_admin -d gnw_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gnw_app:gnw_app_pw@localhost:5432/gnw_test
      MIGRATION_DATABASE_URL: postgresql://gnw_admin:gnw_admin_pw@localhost:5432/gnw_test
      COOKIE_SECRET: ci-test-cookie-secret-minimum-32-chars-ok
      LOG_LEVEL: silent
      GNW_APP_DB_USER: gnw_app
      GNW_APP_DB_PASSWORD: gnw_app_pw
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Verify npm cache integrity
        run: npm cache verify
      - name: Verify committed lockfile
        run: test -f package-lock.json
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Create restricted runtime database role
        run: node scripts/provision-db-role.mjs
      - name: Run migrations
        run: npm run db:migrate
      - name: Verify production closure static gate
        run: npm run verify:production
      - name: Unit tests
        run: npm run test
      - name: Reset test database for independent coverage run
        run: |
          PGPASSWORD=gnw_admin_pw psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          node scripts/provision-db-role.mjs
          npm run db:migrate
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Build server
        run: npm run build:server
      - name: Build client
        run: npm run build:client
      - name: Build production container
        run: docker build --pull -t gnw-ci:${GITHUB_SHA} .
      - name: Smoke test production container
        run: |
          docker rm -f gnw-ci-smoke >/dev/null 2>&1 || true
          docker run -d --network host --name gnw-ci-smoke             -e NODE_ENV=test             -e DATABASE_URL="$DATABASE_URL"             -e COOKIE_SECRET="$COOKIE_SECRET"             -e LOG_LEVEL=silent             gnw-ci:${GITHUB_SHA} >/tmp/gnw-ci-smoke.log 2>&1
          for i in $(seq 1 30); do
            if wget -qO- http://127.0.0.1:3000/api/health >/tmp/gnw-health.json 2>/dev/null &&                wget -qO- http://127.0.0.1:3000/api/ready >/tmp/gnw-ready.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if ! test -s /tmp/gnw-health.json || ! test -s /tmp/gnw-ready.json; then
            echo "::error::GNW production container failed health/readiness smoke test"
            docker ps -a || true
            docker logs gnw-ci-smoke || true
            cat /tmp/gnw-ci-smoke.log || true
            docker inspect gnw-ci-smoke --format '{{json .State}}' || true
            docker inspect gnw-ci-smoke --format 'exit={{.State.ExitCode}} status={{.State.Status}}' || true
            docker stop gnw-ci-smoke || true
            docker rm -f gnw-ci-smoke || true
            exit 1
          fi
          grep -q '"ok":true' /tmp/gnw-health.json
          grep -q '"ok":true' /tmp/gnw-ready.json
          docker stop gnw-ci-smoke
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@59e3b04e820c4cad30462696ac497853a5f7679c
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }

  evidence:
    name: Build Evidence
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Verify committed lockfile install
        run: test -f package-lock.json && npm ci
      - name: Collect evidence
        run: |
          mkdir -p evidence
          node --version > evidence/node-version.txt
          npm --version > evidence/npm-version.txt
          set +e
          npm audit --json > evidence/npm-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ] && [ "$audit_status" -ne 1 ]; then
            exit "$audit_status"
          fi
          jq -n \
            --arg candidate "gnw-production-closure-v3" \
            --arg sha "$(git rev-parse HEAD)" \
            --arg ref "$GITHUB_REF" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg node "$(node --version)" \
            --arg npm "$(npm --version)" \
            '{schema:"GNW.BuildEvidence.v2",candidate:$candidate,sha:$sha,ref:$ref,ts:$ts,node:$node,npm:$npm}' > evidence/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 90
