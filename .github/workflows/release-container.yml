name: GNW Container Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate Kubernetes and Terraform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Validate Kubernetes schemas without a cluster
        run: |
          find k8s -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 \
            | xargs -0 kubeconform -strict -summary
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  build-and-scan:
    name: Build and scan immutable candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          push: false
          tags: local/gnw:${{ github.sha }}
      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0, official safe release
        with:
          image-ref: local/gnw:${{ github.sha }}
          version: v0.76.1
          format: json
          output: trivy-results.json
          vuln-type: os,library
          severity: UNKNOWN,HIGH,CRITICAL
          exit-code: "1"
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 14

  publish-and-sign:
    name: Publish, attest, and sign GHCR image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [validate-manifests, build-and-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Normalize GHCR repository name
        id: image
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          REPOSITORY_LOWER="$(printf '%s' "$SOURCE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/${REPOSITORY_LOWER}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Sign published image by digest
        env:
          IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          echo "Published image: ${IMAGE_REPOSITORY}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Do not deploy until independent review, staging smoke tests, and rollback verification are complete." >> "$GITHUB_STEP_SUMMARY"
