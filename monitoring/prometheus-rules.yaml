groups:
  - name: gnw-alerts
    rules:
      - alert: GNWKillSwitchEngaged
        expr: gnw_kill_switch_active == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "GNW Kill Switch is ACTIVE"
          description: "All governed actions are suspended. Immediate investigation required."

      - alert: GNWCircuitBreakerOpen
        expr: gnw_circuit_breaker_open == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "GNW Circuit Breaker is OPEN"
          description: "Agent actions are paused. Circuit breaker tripped."

      - alert: GNWHighErrorRate
        expr: rate(http_requests_total{status=~"5..",app="gnw"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GNW high 5xx error rate"
          description: "More than 5% of requests are failing."

      - alert: GNWHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{app="gnw"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GNW p95 latency > 2s"

      - alert: GNWPodNotReady
        expr: kube_pod_status_ready{namespace="gnw",condition="true"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GNW pod not ready"
          description: "Pod {{ $labels.pod }} in namespace gnw is not ready."
